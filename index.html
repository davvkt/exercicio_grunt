<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício LESS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Loja Exemplo</h1>
            <nav>
                <ul>
                    <li><a href="#">Início</a></li>
                    <li><a href="#">Produtos</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section class="products">
            <div class="container">
                <h2>Nossos Produtos</h2>
                <div class="product-grid">
                    <div class="product-card">
                        <img src="https://via.placeholder.com/300x200" alt="Produto 1">
                        <h3>Produto 1</h3>
                        <p>Descrição breve do produto.</p>
                        <button class="btn">Comprar</button>
                    </div>
                    <div class="product-card">
                        <img src="https://via.placeholder.com/300x200" alt="Produto 2">
                        <h3>Produto 2</h3>
                        <p>Descrição breve do produto.</p>
                        <button class="btn btn-secondary">Ver Detalhes</button>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <div class="container">
            <p>&copy; 2025 - Exercício LESS</p>
        </div>
    </footer>
</body>
</html>
